server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?currentSchema=${DB_SCHEMA:package_builder}&options=-c%20TimeZone=UTC
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: 123

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jackson:
    time-zone: Asia/Ho_Chi_Minh

jwt:
  signerKey: "hh@-#4O@;HV?=vx[,V&1,o6m>cL}47d/V&kh*6c]A}YV!6^aTrKA>P%)DHj$d@)sM:B^vdZ56{!C2&jA^_[H?Z"
  valid-duration: 1800 # inseconds
  refreshable-duration: 5400 # inseconds

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}